<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel文件比较工具</title>
    <meta name="description" content="快速发现并对比两份Excel文档的差异">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="logo">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/>
                    <polyline points="14 2 14 8 20 8"/>
                </svg>
                <h1 data-i18n="app_title">Excel文件比较工具</h1>
            </div>
            <p class="tagline" data-i18n="tagline">快速发现并对比两份Excel文档的差异</p>
            <div class="lang-selector">
                <select id="langSelector" onchange="i18n.setLanguage(this.value)">
                    <option value="en">English</option>
                    <option value="es">Espa&#241;ol</option>
                    <option value="de">Deutsch</option>
                    <option value="fr">Fran&#231;ais</option>
                    <option value="zh" selected>&#20013;&#25991;</option>
                </select>
            </div>
        </header>

        <input type="file" id="file1Input" accept=".xlsx,.xls" style="display:none;">
        <input type="file" id="file2Input" accept=".xlsx,.xls" style="display:none;">

        <main class="main-content">
            <section class="upload-section">
                <div class="upload-zone" id="file1Zone">
                    <div class="upload-icon">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="17 8 12 3 7 8"/>
                            <line x1="12" y1="3" x2="12" y2="15"/>
                        </svg>
                    </div>
                    <p class="upload-title" data-i18n="file1_title">文件1（旧版本）</p>
                    <p class="upload-text" data-i18n="drag_or_click">拖拽文件到此处或点击上传</p>
                    <p class="upload-hint" data-i18n="supported_formats">支持 .xlsx, .xls 格式</p>
                    <div class="file-info" id="file1Info" style="display: none;">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/>
                            <polyline points="14 2 14 8 20 8"/>
                        </svg>
                        <span id="file1Name"></span>
                        <button class="remove-file" id="removeFileBtn1">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="18" y1="6" x2="6" y2="18"/>
                                <line x1="6" y1="6" x2="18" y2="18"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="swap-button-container">
                    <button class="swap-button" id="swapBtn" data-i18n-title="swap_files" title="交换文件位置">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="16 3 21 3 21 8"/>
                            <line x1="4" y1="20" x2="21" y2="3"/>
                            <polyline points="21 16 21 21 16 21"/>
                            <line x1="15" y1="15" x2="21" y2="21"/>
                            <line x1="4" y1="4" x2="9" y2="9"/>
                        </svg>
                    </button>
                </div>

                <div class="upload-zone" id="file2Zone">
                    <div class="upload-icon">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="17 8 12 3 7 8"/>
                            <line x1="12" y1="3" x2="12" y2="15"/>
                        </svg>
                    </div>
                    <p class="upload-title" data-i18n="file2_title">文件2（新版本）</p>
                    <p class="upload-text" data-i18n="drag_or_click">拖拽文件到此处或点击上传</p>
                    <p class="upload-hint" data-i18n="supported_formats">支持 .xlsx, .xls 格式</p>
                    <div class="file-info" id="file2Info" style="display: none;">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/>
                            <polyline points="14 2 14 8 20 8"/>
                        </svg>
                        <span id="file2Name"></span>
                        <button class="remove-file" id="removeFileBtn2">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="18" y1="6" x2="6" y2="18"/>
                                <line x1="6" y1="6" x2="18" y2="18"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="compare-buttons-container" id="compareBtnsContainer">
                    <button class="compare-action-button" id="directCompareBtn" disabled>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M23 4v6h-6"/>
                            <path d="M1 20v-6h6"/>
                            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
                        </svg>
                        <span data-i18n="compare_now">直接比较</span>
                    </button>
                    <button class="compare-action-button secondary" id="selectCellBtn" disabled>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                            <line x1="3" y1="9" x2="21" y2="9"/>
                            <line x1="3" y1="15" x2="21" y2="15"/>
                            <line x1="9" y1="3" x2="9" y2="21"/>
                            <line x1="15" y1="3" x2="15" y2="21"/>
                        </svg>
                        <span data-i18n="select_start_cell">选择起始单元格</span>
                    </button>
                </div>
            </section>

            <section class="results-section" id="resultsSection" style="display: none;">
                <div class="diff-container">
                    <div class="diff-header">
                        <h3 class="diff-title" data-i18n="differences">差异条目</h3>
                        <button class="maximize-preview-btn" id="maximizeResultsBtn" data-i18n-title="maximize_preview" title="最大化预览">
                            <svg class="icon-maximize" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="15 3 21 3 21 9"/>
                                <polyline points="9 21 3 21 3 15"/>
                                <line x1="21" y1="3" x2="14" y2="10"/>
                                <line x1="3" y1="21" x2="10" y2="14"/>
                            </svg>
                            <svg class="icon-restore" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                                <polyline points="4 14 10 14 10 20"/>
                                <polyline points="20 10 14 10 14 4"/>
                                <line x1="14" y1="10" x2="21" y2="3"/>
                                <line x1="10" y1="14" x2="3" y2="21"/>
                            </svg>
                        </button>
                    </div>
                    <div class="diff-controls">
                        <button class="filter-btn" data-filter="all">
                            <span data-i18n="filter_all">全部</span>
                        </button>
                        <button class="filter-btn active" data-filter="diff">
                            <span data-i18n="filter_diff">差异</span>
                        </button>
                        <div class="filter-separator"></div>
                        <button class="filter-btn" data-filter="added">
                            <span class="filter-legend-color legend-added"></span>
                            <span data-i18n="filter_added">新增</span> <em class="filter-count" id="filterCountAdded">0</em>
                        </button>
                        <button class="filter-btn" data-filter="deleted">
                            <span class="filter-legend-color legend-deleted"></span>
                            <span data-i18n="filter_deleted">删除</span> <em class="filter-count" id="filterCountDeleted">0</em>
                        </button>
                        <button class="filter-btn" data-filter="modified">
                            <span class="filter-legend-color legend-modified"></span>
                            <span data-i18n="filter_modified">修改</span> <em class="filter-count" id="filterCountModified">0</em>
                        </button>
                        <button class="filter-btn" data-filter="same">
                            <span class="filter-legend-color legend-same"></span>
                            <span data-i18n="filter_same">相同</span> <em class="filter-count" id="filterCountSame">0</em>
                        </button>
                        <button class="export-btn-inline" id="exportExcelBtn">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/>
                                <polyline points="14 2 14 8 20 8"/>
                                <path d="m16 13-4 4-4-4"/>
                                <path d="M12 17v-6"/>
                            </svg>
                            <span data-i18n="export_excel">导出Excel</span>
                        </button>
                    </div>
                    <div class="results-tab-bar" id="resultsTabBar"></div>
                    <div class="results-preview-wrapper" id="resultsPreviewWrapper"></div>
                </div>

                <div class="empty-state" id="emptyState" style="display: none;">
                    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                        <polyline points="22 4 12 14.01 9 11.01"/>
                    </svg>
                    <h3 data-i18n="no_differences">文件完全相同</h3>
                    <p data-i18n="no_differences_desc">两份Excel文件没有发现任何差异</p>
                </div>
            </section>
        </main>

        <footer class="app-footer">
            <p data-i18n="footer_text">Excel文件比较工具 &copy; 2024 | 所有处理均在浏览器本地完成，文件不会上传到服务器</p>
        </footer>

        <div class="sheet-preview-container" id="sheetPreviewContainer" style="display: none;">
            <div class="sheet-tab-bar" id="sheetTabBar"></div>
            <div class="file-preview-section" id="filePreviewSection">
                <div class="file-preview-block" id="file1PreviewBlock">
                    <div class="preview-block-header">
                        <span class="preview-file-title" id="file1PreviewTitle"></span>
                        <div class="start-cell-selector">
                            <span class="start-cell-label" data-i18n="start_cell_label">从单元格开始：</span>
                            <span id="startCellValue1" class="start-cell-value">A1</span>
                            <button class="start-cell-reset-btn" id="startCellReset1" data-i18n="reset">重置</button>
                        </div>
                    </div>
                    <div class="preview-table-wrapper">
                        <table class="preview-table" id="file1PreviewTable"></table>
                    </div>
                </div>
                <div class="file-preview-block" id="file2PreviewBlock">
                    <div class="preview-block-header">
                        <span class="preview-file-title" id="file2PreviewTitle"></span>
                        <div class="start-cell-selector">
                            <span class="start-cell-label" data-i18n="start_cell_label">从单元格开始：</span>
                            <span id="startCellValue2" class="start-cell-value">A1</span>
                            <button class="start-cell-reset-btn" id="startCellReset2" data-i18n="reset">重置</button>
                        </div>
                    </div>
                    <div class="preview-table-wrapper">
                        <table class="preview-table" id="file2PreviewTable"></table>
                    </div>
                </div>
            </div>
        </div>

        <div class="confirm-compare-container" id="confirmCompareContainer" style="display: none;">
            <button class="confirm-compare-button" id="confirmCompareBtn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M23 4v6h-6"/>
                    <path d="M1 20v-6h6"/>
                    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
                </svg>
                <span data-i18n="start_compare">开始比较</span>
            </button>
        </div>

        <div class="loading" id="loading" style="display: none;">
            <div class="spinner"></div>
            <p data-i18n="loading">正在比较文件，请稍候...</p>
        </div>

        <div class="modal-overlay" id="previewModal" style="display: none !important;">
            <div class="modal-container">
                <div class="modal-header">
                    <h3 data-i18n="full_preview_title">全文条目预览</h3>
                    <div class="modal-actions">
                        <button class="modal-action-btn" id="fullscreenBtn" data-i18n-title="fullscreen" title="全屏">
                            <svg class="icon-fullscreen" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="15 3 21 3 21 9"/>
                                <polyline points="9 21 3 21 3 15"/>
                                <line x1="21" y1="3" x2="14" y2="10"/>
                                <line x1="3" y1="21" x2="10" y2="14"/>
                            </svg>
                            <svg class="icon-exit-fullscreen" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                                <polyline points="4 14 10 14 10 20"/>
                                <polyline points="20 10 14 10 14 4"/>
                                <line x1="14" y1="10" x2="21" y2="3"/>
                                <line x1="10" y1="14" x2="3" y2="21"/>
                            </svg>
                        </button>
                        <button class="modal-close" id="modalCloseBtn" data-i18n-title="close" title="关闭">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="18" y1="6" x2="6" y2="18"/>
                                <line x1="6" y1="6" x2="18" y2="18"/>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="modal-body">
                    <div class="tab-bar" id="tabBar"></div>
                    <div class="preview-body" id="previewBody"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="xlsx.min.js"></script>
    <script src="jszip.min.js"></script>
    <script src="styles-parser.js"></script>
    <script src="i18n.js"></script>
    <script src="app.js"></script>
</body>
</html>
